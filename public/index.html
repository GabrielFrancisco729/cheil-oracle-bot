<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo de Dados - Cheil BI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary-dark: #1a1a1a;
      --primary-light: #ffffff;
      --accent-purple: #6b5fb3;
      --accent-blue: #5b7cfa;
      --bg-gray: #f8f9fa;
      --border-light: #e9ecef;
      --text-dark: #212529;
      --text-light: #6c757d;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #8b7cc8 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--primary-light);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .header {
      background: var(--primary-dark);
      color: var(--primary-light);
      padding: 30px;
      text-align: center;
      border-bottom: 4px solid var(--accent-purple);
    }
    
    .header h1 { font-size: 28px; margin-bottom: 5px; }
    .header p { font-size: 14px; color: #aaa; }
    
    .disconnect-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: var(--text-light);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    
    .content { padding: 30px; }
    
    #filterScreen { display: block; }
    #summaryScreen { display: none; }
    #chatScreen { display: none; }
    
    .filter-section {
      margin-bottom: 30px;
    }
    
    .filter-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-dark);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .filter-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
    }
    
    .filter-btn {
      padding: 12px 16px;
      border: 2px solid var(--border-light);
      background: var(--bg-gray);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      color: var(--text-dark);
    }
    
    .filter-btn:hover { border-color: var(--accent-purple); background: #f0e6ff; }
    .filter-btn.active { background: var(--accent-purple); color: white; border-color: var(--accent-purple); }
    
    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-blue) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }
    
    .start-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(107, 95, 179, 0.4); }
    .start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* SUMMARY SCREEN */
    .context-badge {
      display: inline-block;
      background: var(--accent-blue);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    
    .summary-content {
      background: #fafbfc;
      color: var(--text-dark);
      padding: 24px;
      border-radius: 8px;
      line-height: 1.7;
      margin-bottom: 20px;
      white-space: pre-wrap;
      font-size: 13px;
      font-family: 'Segoe UI', Roboto, sans-serif;
      border: 1px solid var(--border-light);
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .buttons-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    .btn-secondary {
      flex: 1;
      padding: 12px;
      background: var(--border-light);
      color: var(--text-dark);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .btn-secondary:hover { background: #dee2e6; }
    
    .btn-primary {
      flex: 1;
      padding: 12px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .btn-primary:hover { background: #5a4f99; }
    
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 14px;
      color: var(--text-light);
    }
    
    .loading-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent-blue);
      border-radius: 50%;
      animation: loading 1.4s infinite;
      margin: 0 4px;
    }
    
    .loading-dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-dot:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes loading {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Oráculo de Dados</h1>
      <p>Cheil BI - Análise de Performance</p>
      <button id="disconnectBtn" class="disconnect-btn" style="display:none;">Desconectar</button>
    </div>
    
    <div class="content">
      <!-- FILTROS -->
      <div id="filterScreen">
        <div class="filter-section">
          <label>Qual é a subsidiária?</label>
          <div id="subsidariesContainer" class="filter-options">
            <button class="filter-btn" data-sub="LAO">LAO</button>
          </div>
        </div>
        
        <div class="filter-section">
          <label>Qual período?</label>
          <div class="filter-options">
            <button class="filter-btn" data-period="current_week">Semana Atual</button>
            <button class="filter-btn" data-period="last_week">Semana Passada</button>
            <button class="filter-btn" data-period="current_month">Mês Corrente</button>
            <button class="filter-btn" data-period="last_month">Mês Passado</button>
            <button class="filter-btn" data-period="all_time">Todo Período</button>
          </div>
        </div>
        
        <button id="startBtn" class="start-btn" disabled>Gerar Resumo</button>
      </div>
      
      <!-- RESUMO -->
      <div id="summaryScreen">
        <div id="contextBadge" class="context-badge"></div>
        
        <div id="loadingIndicator" class="loading" style="display:none;">
          <div>Carregando análise<span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
        </div>
        
        <div id="summaryContent" class="summary-content"></div>
        
        <div class="buttons-row">
          <button class="btn-secondary" onclick="backToFilters()">Alterar Filtros</button>
          <button class="btn-primary" onclick="showChat()">Fazer Perguntas</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const API_KEY_STORAGE = 'oracle_api_key';
    
    let selectedSubsidiaries = [];
    let selectedPeriod = null;
    let selectedPeriod = null;
    let apiKey = null;
    
    const filterScreen = document.getElementById('filterScreen');
    const summaryScreen = document.getElementById('summaryScreen');
    const startBtn = document.getElementById('startBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const contextBadge = document.getElementById('contextBadge');
    const summaryContent = document.getElementById('summaryContent');
    const loadingIndicator = document.getElementById('loadingIndicator');
    
    // Carregar subsidiárias
    async function loadSubsidiaries() {
      try {
        const response = await fetch(`${API_URL}/api/subsidiaries`);
        const data = await response.json();
        
        if (data.success && data.subsidiaries && data.subsidiaries.length > 0) {
          const container = document.getElementById('subsidariesContainer');
          container.innerHTML = '<button class="filter-btn" data-sub="LAO">LAO</button>';
          
          data.subsidiaries.forEach(sub => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.sub = sub;
            btn.textContent = sub;
            container.appendChild(btn);
          });
          
          attachSubsidiaryListeners();
          attachPeriodListeners();
        }
      } catch (error) {
        console.error('Error loading subsidiaries:', error);
      }
    }
    
    function attachSubsidiaryListeners() {
      document.querySelectorAll('[data-sub]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sub = btn.dataset.sub;
          
          if (sub === 'LAO') {
            // LAO desseleciona todas as outras
            selectedSubsidiaries = ['LAO'];
            document.querySelectorAll('[data-sub]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
          } else {
            // Remove LAO se tiver selecionado
            selectedSubsidiaries = selectedSubsidiaries.filter(s => s !== 'LAO');
            document.querySelectorAll('[data-sub="LAO"]').forEach(b => b.classList.remove('active'));
            
            // Multi-select: Ctrl/Cmd + Click
            if (e.ctrlKey || e.metaKey) {
              if (selectedSubsidiaries.includes(sub)) {
                selectedSubsidiaries = selectedSubsidiaries.filter(s => s !== sub);
                btn.classList.remove('active');
              } else {
                selectedSubsidiaries.push(sub);
                btn.classList.add('active');
              }
            } else {
              // Click normal: seleciona apenas essa
              selectedSubsidiaries = [sub];
              document.querySelectorAll('[data-sub]').forEach(b => {
                if (b !== btn) b.classList.remove('active');
              });
              btn.classList.add('active');
            }
          }
          
          updateStartBtn();
        });
      });
    }
    
    function attachPeriodListeners() {
      document.querySelectorAll('[data-period]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedPeriod = btn.dataset.period;
          updateStartBtn();
        });
      });
    }
    
    function updateStartBtn() {
      startBtn.disabled = !selectedSubsidiaries.length || !selectedPeriod;
    }
    
    startBtn.addEventListener('click', async () => {
      apiKey = localStorage.getItem(API_KEY_STORAGE);
      if (!apiKey) {
        apiKey = prompt('Insira sua API Key do Claude (sk-ant-...):');
        if (!apiKey) return;
        localStorage.setItem(API_KEY_STORAGE, apiKey);
      }
      
      filterScreen.style.display = 'none';
      summaryScreen.style.display = 'block';
      disconnectBtn.style.display = 'block';
      updateContextBadge();
      loadSummary();
    });
    
    async function loadSummary() {
      loadingIndicator.style.display = 'block';
      summaryContent.innerHTML = '';
      
      try {
        const response = await fetch(`${API_URL}/api/summary`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey,
            context: { subsidiaries: selectedSubsidiaries, period: selectedPeriod }
          })
        });
        
        const data = await response.json();
        
        loadingIndicator.style.display = 'none';
        
        if (data.success) {
          summaryContent.textContent = data.summary;
        } else {
          summaryContent.textContent = `Erro: ${data.error}`;
        }
      } catch (error) {
        loadingIndicator.style.display = 'none';
        summaryContent.textContent = `Erro: ${error.message}`;
      }
    }
    
    function updateContextBadge() {
      let subLabel;
      if (selectedSubsidiaries.includes('LAO')) {
        subLabel = 'LAO (Todas)';
      } else {
        subLabel = selectedSubsidiaries.length > 1 
          ? `${selectedSubsidiaries.length} subs` 
          : selectedSubsidiaries[0];
      }
      
      const periodLabels = {
        current_week: 'Semana Atual',
        last_week: 'Semana Passada',
        current_month: 'Mês Corrente',
        last_month: 'Mês Passado',
        all_time: 'Todo Período'
      };
      contextBadge.textContent = `${subLabel} • ${periodLabels[selectedPeriod] || selectedPeriod}`;
    }
    
    function backToFilters() {
      filterScreen.style.display = 'block';
      summaryScreen.style.display = 'none';
      disconnectBtn.style.display = 'none';
    }
    
    function showChat() {
      alert('Chat de perguntas - em desenvolvimento!');
    }
    
    disconnectBtn.addEventListener('click', () => {
      localStorage.removeItem(API_KEY_STORAGE);
      location.reload();
    });
    
    loadSubsidiaries();
    attachPeriodListeners();
  </script>
</body>
</html>
