<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo de Dados - Cheil BI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary-dark: #1a1a1a;
      --primary-light: #ffffff;
      --accent-purple: #6b5fb3;
      --accent-blue: #5b7cfa;
      --accent-pink: #ff6b9d;
      --success: #51cf66;
      --warning: #ffd43b;
      --bg-gray: #f8f9fa;
      --border-light: #e9ecef;
      --text-dark: #212529;
      --text-light: #6c757d;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--accent-purple) 0%, #8b7cc8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: var(--primary-light);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      overflow: hidden;
    }
    
    .header {
      background: var(--primary-dark);
      color: var(--primary-light);
      padding: 30px;
      text-align: center;
      border-bottom: 4px solid var(--accent-purple);
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 5px;
      font-weight: 600;
    }
    
    .header p {
      font-size: 14px;
      color: #aaa;
    }
    
    .content {
      padding: 30px;
    }
    
    /* FILTROS INICIAIS */
    #filterScreen {
      display: block;
    }
    
    #chatScreen {
      display: none;
    }
    
    .filter-section {
      margin-bottom: 30px;
    }
    
    .filter-section label {
      display: block;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text-dark);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .filter-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    .filter-btn {
      padding: 12px 16px;
      border: 2px solid var(--border-light);
      background: var(--bg-gray);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
      color: var(--text-dark);
    }
    
    .filter-btn:hover {
      border-color: var(--accent-purple);
      background: #f0e6ff;
    }
    
    .filter-btn.active {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }
    
    .start-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-blue) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 20px;
    }
    
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(107, 95, 179, 0.4);
    }
    
    .start-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    /* CHAT */
    .chat-box {
      height: 400px;
      overflow-y: auto;
      background: var(--bg-gray);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }
    
    .message {
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    
    .message.user {
      background: var(--accent-blue);
      color: white;
      margin-left: 20px;
      text-align: right;
    }
    
    .message.bot {
      background: var(--primary-light);
      color: var(--text-dark);
      margin-right: 20px;
      border: 1px solid var(--border-light);
    }
    
    .message.bot.error {
      background: #ffe0e0;
      color: #c92a2a;
      border-color: #ff8787;
    }
    
    .message.system {
      background: var(--warning);
      color: var(--text-dark);
      font-weight: 500;
      text-align: center;
      margin: 0 0;
    }
    
    .loading {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent-blue);
      border-radius: 50%;
      animation: loading 1.4s infinite;
    }
    
    .loading:nth-child(2) { animation-delay: 0.2s; }
    .loading:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes loading {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }
    
    .input-area {
      display: flex;
      gap: 10px;
    }
    
    #questionInput {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border-light);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    
    #questionInput:focus {
      outline: none;
      border-color: var(--accent-purple);
    }
    
    .send-btn {
      padding: 12px 24px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .send-btn:hover {
      background: #5a4f99;
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .context-badge {
      display: inline-block;
      background: var(--accent-blue);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 16px;
      font-weight: 500;
    }
    
    .disconnect-btn {
      padding: 8px 16px;
      background: var(--text-light);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      position: absolute;
      top: 20px;
      right: 20px;
    }
    
    .disconnect-btn:hover {
      background: var(--text-dark);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔮 Oráculo de Dados</h1>
      <p>Cheil BI - Análise de Performance</p>
      <button id="disconnectBtn" class="disconnect-btn" style="display:none;">Desconectar</button>
    </div>
    
    <div class="content">
      <!-- TELA DE FILTROS -->
      <div id="filterScreen">
        <div class="filter-section">
          <label>Qual é a subsidiária?</label>
          <div class="filter-options">
            <button class="filter-btn" data-sub="SEDA">🇧🇷 SEDA</button>
            <button class="filter-btn" data-sub="MX">🇲🇽 MX</button>
            <button class="filter-btn" data-sub="CE">🏢 CE</button>
            <button class="filter-btn" data-sub="DA">🏢 DA</button>
            <button class="filter-btn" data-sub="HA">🏢 HA</button>
            <button class="filter-btn" data-sub="WM">🏢 WM</button>
          </div>
        </div>
        
        <div class="filter-section">
          <label>Qual período?</label>
          <div class="filter-options">
            <button class="filter-btn" data-period="current_week">📅 Semana Atual</button>
            <button class="filter-btn" data-period="last_week">📅 Semana Passada</button>
            <button class="filter-btn" data-period="current_month">📊 Mês Corrente</button>
            <button class="filter-btn" data-period="last_month">📊 Mês Passado</button>
            <button class="filter-btn" data-period="custom">⚙️ Outro</button>
            <button class="filter-btn" data-period="all_time">📈 Todo Período</button>
          </div>
        </div>
        
        <button id="startBtn" class="start-btn" disabled>Começar Análise</button>
      </div>
      
      <!-- TELA DE CHAT -->
      <div id="chatScreen">
        <div id="contextBadge" class="context-badge"></div>
        <div id="chatBox" class="chat-box"></div>
        <div class="input-area">
          <input type="text" id="questionInput" placeholder="Faça uma pergunta sobre seus dados...">
          <button id="sendBtn" class="send-btn">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const API_KEY_STORAGE = 'oracle_api_key';
    
    let selectedSubsidiary = null;
    let selectedPeriod = null;
    let apiKey = null;
    let messages = [];
    
    // Elementos
    const filterScreen = document.getElementById('filterScreen');
    const chatScreen = document.getElementById('chatScreen');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const startBtn = document.getElementById('startBtn');
    const sendBtn = document.getElementById('sendBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const chatBox = document.getElementById('chatBox');
    const questionInput = document.getElementById('questionInput');
    const contextBadge = document.getElementById('contextBadge');
    
    // EVENT LISTENERS
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const sub = btn.dataset.sub;
        const period = btn.dataset.period;
        
        if (sub) {
          document.querySelectorAll('[data-sub]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSubsidiary = sub;
        }
        
        if (period) {
          document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedPeriod = period;
        }
        
        updateStartBtn();
      });
    });
    
    function updateStartBtn() {
      startBtn.disabled = !selectedSubsidiary || !selectedPeriod;
    }
    
    startBtn.addEventListener('click', () => {
      apiKey = localStorage.getItem(API_KEY_STORAGE);
      if (!apiKey) {
        apiKey = prompt('Insira sua API Key do Claude (sk-ant-...):');
        if (!apiKey) return;
        localStorage.setItem(API_KEY_STORAGE, apiKey);
      }
      
      filterScreen.style.display = 'none';
      chatScreen.style.display = 'block';
      disconnectBtn.style.display = 'block';
      updateContextBadge();
      addSystemMessage(`Analisando dados de ${selectedSubsidiary} - ${getPeriodLabel()}`);
    });
    
    sendBtn.addEventListener('click', async () => {
      const question = questionInput.value.trim();
      if (!question) return;
      
      addMessage('user', question);
      questionInput.value = '';
      sendBtn.disabled = true;
      
      try {
        const response = await fetch(`${API_URL}/api/ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question,
            apiKey,
            history: messages.filter(m => m.role !== 'system'),
            context: { subsidiary: selectedSubsidiary, period: selectedPeriod }
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          addMessage('bot', data.answer);
        } else {
          addMessage('bot error', `❌ ${data.error}`);
        }
      } catch (error) {
        addMessage('bot error', `❌ Erro: ${error.message}`);
      } finally {
        sendBtn.disabled = false;
        questionInput.focus();
      }
    });
    
    questionInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
    
    disconnectBtn.addEventListener('click', () => {
      localStorage.removeItem(API_KEY_STORAGE);
      location.reload();
    });
    
    function addMessage(role, content) {
      messages.push({ role, content });
      const msgEl = document.createElement('div');
      msgEl.className = `message ${role}`;
      msgEl.textContent = content;
      chatBox.appendChild(msgEl);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function addSystemMessage(text) {
      messages.push({ role: 'system', content: text });
      const msgEl = document.createElement('div');
      msgEl.className = 'message system';
      msgEl.textContent = text;
      chatBox.appendChild(msgEl);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function updateContextBadge() {
      contextBadge.textContent = `${selectedSubsidiary} • ${getPeriodLabel()}`;
    }
    
    function getPeriodLabel() {
      const labels = {
        current_week: 'Semana Atual',
        last_week: 'Semana Passada',
        current_month: 'Mês Corrente',
        last_month: 'Mês Passado',
        custom: 'Período Customizado',
        all_time: 'Todo Período'
      };
      return labels[selectedPeriod] || selectedPeriod;
    }
  </script>
</body>
</html>
