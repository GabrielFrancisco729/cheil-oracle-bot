<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo de Dados - Cheil BI</title>
  <style>
    :root {
      --accent-purple: #6366f1;
      --text-dark: #1a1a1a;
      --text-light: #666;
      --bg-white: #ffffff;
      --bg-gray: #f5f5f5;
      --border-light: #e0e0e0;
      --success-green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 700px;
    }

    .header {
      background: var(--text-dark);
      color: white;
      padding: 20px;
      border-radius: 16px 16px 0 0;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.bot .message-content {
      background: var(--bg-gray);
      color: var(--text-dark);
      border-left: 3px solid var(--accent-purple);
    }

    .message.user .message-content {
      background: var(--accent-purple);
      color: white;
    }

    .input-area {
      padding: 16px;
      border-top: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .options-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-btn {
      padding: 10px 14px;
      border: 1px solid var(--border-light);
      background: var(--bg-white);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dark);
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent-purple);
      background: rgba(99, 102, 241, 0.05);
    }

    .option-btn.selected {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .period-select {
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-dark);
      background: var(--bg-white);
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-select:hover {
      border-color: var(--accent-purple);
    }

    .period-select:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .confirm-btn {
      padding: 12px 16px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .confirm-btn:hover:not(:disabled) {
      background: #5558e3;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .confirm-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .loading-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-purple);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-8px);
      }
    }

    .disconnect-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 12px;
      background: var(--bg-gray);
      border: 1px solid var(--border-light);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-light);
      transition: all 0.2s;
    }

    .disconnect-btn:hover {
      background: #f0f0f0;
      color: var(--text-dark);
    }

    .api-key-screen {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .api-key-screen h2 {
      font-size: 18px;
      color: var(--text-dark);
    }

    .api-key-screen p {
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
    }

    .api-key-input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 13px;
      margin: 12px 0;
    }

    .api-key-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .submit-btn {
      padding: 12px 20px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #5558e3;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <button class="disconnect-btn" id="disconnectBtn" style="display: none;">Sair</button>
      <h1>Oráculo de Dados</h1>
      <p>Cheil BI - Análise de Performance</p>
    </div>

    <!-- Tela de API Key -->
    <div id="apiKeyScreen" class="chat-area" style="justify-content: center; padding: 40px 20px;">
      <div class="api-key-screen">
        <h2>Bem-vindo ao Oráculo</h2>
        <p>Para começar, você precisa fornecer sua API Key do Claude</p>
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="sk-ant-...">
        <button class="submit-btn" id="submitApiKeyBtn">Conectar</button>
      </div>
    </div>

    <!-- Chat -->
    <div id="chatScreen" style="display: none; flex: 1; display: flex; flex-direction: column;">
      <div id="chatArea" class="chat-area"></div>
      <div class="input-area" id="inputArea"></div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const API_KEY_STORAGE = 'cheil_oracle_api_key';
    
    let apiKey = null;
    let conversationState = 'awaiting_subsidiary'; // awaiting_subsidiary, awaiting_period, ready
    let selectedSubsidiaries = [];
    let selectedPeriod = null;
    let subsidiariesList = [];

    const apiKeyScreen = document.getElementById('apiKeyScreen');
    const chatScreen = document.getElementById('chatScreen');
    const chatArea = document.getElementById('chatArea');
    const inputArea = document.getElementById('inputArea');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const submitApiKeyBtn = document.getElementById('submitApiKeyBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');

    // Inicializar
    const storedApiKey = localStorage.getItem(API_KEY_STORAGE);
    if (storedApiKey) {
      apiKey = storedApiKey;
      showChatScreen();
    }

    submitApiKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Digite sua API Key!');
        return;
      }
      apiKey = key;
      localStorage.setItem(API_KEY_STORAGE, key);
      showChatScreen();
    });

    disconnectBtn.addEventListener('click', () => {
      localStorage.removeItem(API_KEY_STORAGE);
      location.reload();
    });

    async function showChatScreen() {
      apiKeyScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      disconnectBtn.style.display = 'block';

      // Carregar subsidiárias
      await loadSubsidiaries();

      // Primeira mensagem
      addBotMessage('Olá! Qual é a sua subsidiária?');
      showSubsidiaryOptions();
    }

    async function loadSubsidiaries() {
      try {
        const response = await fetch(`${API_URL}/api/subsidiaries`);
        const data = await response.json();
        
        if (data.success && data.subsidiaries) {
          // Agrupar SELA*
          let subs = data.subsidiaries;
          const selaGroup = subs.filter(s => s.startsWith('SELA'));
          const others = subs.filter(s => !s.startsWith('SELA'));
          
          subsidiariesList = ['LAO', ...others, ...(selaGroup.length > 0 ? ['SELA'] : [])];
        }
      } catch (error) {
        console.error('Error loading subsidiaries:', error);
      }
    }

    function showSubsidiaryOptions() {
      inputArea.innerHTML = '';
      const container = document.createElement('div');
      container.className = 'options-container';

      subsidiariesList.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = sub;
        btn.addEventListener('click', () => {
          selectSubsidiary(sub);
        });
        container.appendChild(btn);
      });

      inputArea.appendChild(container);
    }

    function selectSubsidiary(sub) {
      selectedSubsidiaries = [sub];
      addUserMessage(sub);
      conversationState = 'awaiting_period';
      
      setTimeout(() => {
        addBotMessage('Qual período você deseja analisar?');
        showPeriodOptions();
      }, 500);
    }

    function showPeriodOptions() {
      inputArea.innerHTML = '';
      
      const select = document.createElement('select');
      select.className = 'period-select';
      
      const options = [
        { value: 'quarter_current', text: 'Quarter Atual' },
        { value: 'quarter_last', text: 'Quarter Passado' },
        { value: 'current_week', text: 'Semana Atual' },
        { value: 'last_week', text: 'Semana Passada' },
        { value: 'current_month', text: 'Mês Corrente' },
        { value: 'last_month', text: 'Mês Passado' },
        { value: 'all_time', text: 'Todo Período' }
      ];

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecione um período...';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);

      options.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.value;
        option.textContent = opt.text;
        select.appendChild(option);
      });

      select.addEventListener('change', () => {
        if (select.value) {
          selectPeriod(select.value, options.find(o => o.value === select.value).text);
        }
      });

      inputArea.appendChild(select);
    }

    function selectPeriod(value, text) {
      selectedPeriod = value;
      addUserMessage(text);
      conversationState = 'ready';

      setTimeout(() => {
        addBotMessage(`Pronto! Subsidiária: ${selectedSubsidiaries[0]} | Período: ${text}`);
        showReadyOptions();
      }, 500);
    }

    function showReadyOptions() {
      inputArea.innerHTML = '';
      
      const container = document.createElement('div');
      container.className = 'options-container';

      const resumoBtn = document.createElement('button');
      resumoBtn.className = 'option-btn';
      resumoBtn.textContent = 'Gerar Resumo';
      resumoBtn.addEventListener('click', () => {
        addUserMessage('Gerar Resumo');
        addBotMessage('Gerando resumo...');
        // TODO: Implementar chamada ao /api/summary
      });
      container.appendChild(resumoBtn);

      const alterarBtn = document.createElement('button');
      alterarBtn.className = 'option-btn';
      alterarBtn.textContent = 'Alterar Filtros';
      alterarBtn.addEventListener('click', () => {
        conversationState = 'awaiting_subsidiary';
        selectedSubsidiaries = [];
        selectedPeriod = null;
        chatArea.innerHTML = '';
        addBotMessage('Qual é a sua subsidiária?');
        showSubsidiaryOptions();
      });
      container.appendChild(alterarBtn);

      inputArea.appendChild(container);
    }

    function addBotMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message bot';
      msg.innerHTML = `<div class="message-content">${text}</div>`;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function addUserMessage(text) {
      const msg = document.createElement('div');
      msg.className = 'message user';
      msg.innerHTML = `<div class="message-content">${text}</div>`;
      chatArea.appendChild(msg);
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  </script>
</body>
</html>
