<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo de Dados - Cheil BI</title>
  <style>
    :root {
      --accent-purple: #6366f1;
      --text-dark: #1a1a1a;
      --text-light: #666;
      --bg-white: #ffffff;
      --bg-gray: #f5f5f5;
      --border-light: #e0e0e0;
      --success-green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--bg-white);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 800px;
    }

    .header {
      background: var(--text-dark);
      color: white;
      padding: 16px 20px;
      border-radius: 16px 16px 0 0;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .header p {
      font-size: 11px;
      opacity: 0.9;
    }

    .disconnect-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      color: white;
      transition: all 0.2s;
    }

    .disconnect-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* TABS */
    .tabs-container {
      display: flex;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg-white);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      padding: 12px 14px;
      border: none;
      background: var(--bg-white);
      color: var(--text-light);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
      text-align: center;
    }

    .tab-btn:hover {
      color: var(--text-dark);
    }

    .tab-btn.active {
      color: var(--accent-purple);
      border-bottom-color: var(--accent-purple);
    }

    /* CHAT LAYOUT */
    .chat-container {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-container.active {
      display: flex;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.bot .message-content {
      background: var(--bg-gray);
      color: var(--text-dark);
      border-left: 3px solid var(--accent-purple);
    }

    .message.user .message-content {
      background: var(--accent-purple);
      color: white;
    }

    /* INPUT AREA */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-btn {
      padding: 10px 14px;
      border: 1px solid var(--border-light);
      background: var(--bg-white);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dark);
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: var(--accent-purple);
      background: rgba(99, 102, 241, 0.05);
    }

    .option-btn.selected {
      background: var(--accent-purple);
      color: white;
      border-color: var(--accent-purple);
    }

    .period-select {
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-dark);
      background: var(--bg-white);
      cursor: pointer;
      transition: all 0.2s;
    }

    .period-select:hover {
      border-color: var(--accent-purple);
    }

    .period-select:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .text-input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .text-input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-dark);
      resize: none;
      max-height: 80px;
      font-family: inherit;
    }

    .text-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .mic-btn {
      padding: 8px 10px;
      background: var(--bg-gray);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      width: 38px;
    }

    .mic-btn:hover {
      background: #e8e8e8;
      border-color: var(--accent-purple);
    }

    .mic-btn.recording {
      background: #ff4757;
      color: white;
      border-color: #ff4757;
      animation: pulse 0.6s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(255, 71, 87, 0);
      }
    }

    .send-btn {
      padding: 10px 16px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      height: 38px;
      white-space: nowrap;
    }

    .send-btn:hover:not(:disabled) {
      background: #5558e3;
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* API KEY SCREEN */
    .api-key-screen {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .api-key-screen h2 {
      font-size: 18px;
      color: var(--text-dark);
    }

    .api-key-screen p {
      color: var(--text-light);
      font-size: 13px;
      line-height: 1.5;
    }

    .api-key-input {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 13px;
      margin: 12px 0;
    }

    .api-key-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
    }

    .submit-btn {
      padding: 12px 20px;
      background: var(--accent-purple);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .submit-btn:hover {
      background: #5558e3;
    }

    .loading {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .loading-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-purple);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }

    .loading-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      40% {
        opacity: 1;
        transform: translateY(-8px);
      }
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      padding: 8px 12px;
      border: 1px solid var(--border-light);
      background: var(--bg-white);
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-purple);
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--bg-gray);
      border-color: var(--accent-purple);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- API KEY SCREEN -->
    <div id="apiKeyScreen" style="flex: 1; display: flex;">
      <div class="api-key-screen" style="width: 100%;">
        <h2>Bem-vindo ao Oráculo</h2>
        <p>Para começar, você precisa fornecer sua API Key do Claude</p>
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="sk-ant-...">
        <button class="submit-btn" id="submitApiKeyBtn">Conectar</button>
      </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="mainScreen" style="display: none; flex: 1; display: flex; flex-direction: column;">
      <!-- HEADER -->
      <div class="header">
        <button class="disconnect-btn" id="disconnectBtn">Sair</button>
        <h1>Oráculo de Dados</h1>
        <p>Cheil BI - Análise de Performance</p>
      </div>

      <!-- TABS -->
      <div class="tabs-container">
        <button class="tab-btn active" data-tab="chat">💬 Chat</button>
        <button class="tab-btn" data-tab="resumo-exec">📊 Resumo Executivo</button>
        <button class="tab-btn" data-tab="resumo-ger">📈 Resumo Gerencial</button>
        <button class="tab-btn" data-tab="slides">📑 Slides</button>
        <button class="tab-btn" data-tab="best-worst">⭐ Best x Worst</button>
      </div>

      <!-- CHAT TABS -->
      <div id="chat" class="chat-container active">
        <div class="chat-messages"></div>
        <div class="input-area"></div>
      </div>

      <div id="resumo-exec" class="chat-container">
        <div class="chat-messages"></div>
        <div class="input-area"></div>
      </div>

      <div id="resumo-ger" class="chat-container">
        <div class="chat-messages"></div>
        <div class="input-area"></div>
      </div>

      <div id="slides" class="chat-container">
        <div class="chat-messages"></div>
        <div class="input-area"></div>
      </div>

      <div id="best-worst" class="chat-container">
        <div class="chat-messages"></div>
        <div class="input-area"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = window.location.origin;
    const API_KEY_STORAGE = 'cheil_oracle_api_key';
    
    let apiKey = null;
    let selectedSubsidiaries = [];
    let selectedPeriod = null;
    let subsidiariesList = [];
    let mediaRecorder = null;
    let recordingChunks = [];

    // State para cada aba
    const tabStates = {
      chat: { initialized: false, conversationState: 'awaiting_subsidiary' },
      'resumo-exec': { initialized: false, conversationState: 'ready', generated: false },
      'resumo-ger': { initialized: false, conversationState: 'ready', generated: false },
      'slides': { initialized: false, conversationState: 'ready' },
      'best-worst': { initialized: false, conversationState: 'ready' }
    };

    const apiKeyScreen = document.getElementById('apiKeyScreen');
    const mainScreen = document.getElementById('mainScreen');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const submitApiKeyBtn = document.getElementById('submitApiKeyBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tabName = btn.dataset.tab;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.chat-container').forEach(a => a.classList.remove('active'));
        
        btn.classList.add('active');
        document.getElementById(tabName).classList.add('active');

        // Inicializar aba se necessário
        if (!tabStates[tabName].initialized) {
          initializeTab(tabName);
        }

        // Auto-gerar resumo se for abas de resumo
        if ((tabName === 'resumo-exec' || tabName === 'resumo-ger') && 
            selectedSubsidiaries.length && selectedPeriod &&
            !tabStates[tabName].generated) {
          generateResumo(tabName);
        }
      });
    });

    // API Key
    const storedApiKey = localStorage.getItem(API_KEY_STORAGE);
    if (storedApiKey) {
      apiKey = storedApiKey;
      showMainScreen();
    }

    submitApiKeyBtn.addEventListener('click', () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        alert('Digite sua API Key!');
        return;
      }
      apiKey = key;
      localStorage.setItem(API_KEY_STORAGE, key);
      showMainScreen();
    });

    disconnectBtn.addEventListener('click', () => {
      localStorage.removeItem(API_KEY_STORAGE);
      location.reload();
    });

    async function showMainScreen() {
      apiKeyScreen.style.display = 'none';
      mainScreen.style.display = 'flex';
      await loadSubsidiaries();
      initializeTab('chat');
    }

    async function loadSubsidiaries() {
      try {
        const response = await fetch(`${API_URL}/api/subsidiaries`);
        const data = await response.json();
        
        if (data.success && data.subsidiaries) {
          let subs = data.subsidiaries;
          const selaGroup = subs.filter(s => s.startsWith('SELA'));
          const others = subs.filter(s => !s.startsWith('SELA'));
          
          subsidiariesList = ['LAO', ...others, ...(selaGroup.length > 0 ? ['SELA'] : [])];
        }
      } catch (error) {
        console.error('Error loading subsidiaries:', error);
      }
    }

    function initializeTab(tabName) {
      tabStates[tabName].initialized = true;

      if (tabName === 'chat') {
        addMessageToTab('chat', 'Olá! Qual é a sua subsidiária?', 'bot');
        showSubsidiaryOptions('chat');
      } else if (tabName === 'resumo-exec' || tabName === 'resumo-ger') {
        // Abas de resumo serão inicializadas quando forem ativadas
        if (selectedSubsidiaries.length && selectedPeriod) {
          generateResumo(tabName);
        } else {
          addMessageToTab(tabName, 'Configure seus filtros na aba Chat primeiro!', 'bot');
          showGoToChatButton(tabName);
        }
      } else {
        addMessageToTab(tabName, 'Em desenvolvimento...', 'bot');
      }
    }

    function getTabElements(tabName) {
      const container = document.getElementById(tabName);
      return {
        messages: container.querySelector('.chat-messages'),
        inputArea: container.querySelector('.input-area')
      };
    }

    function addMessageToTab(tabName, text, sender) {
      const { messages } = getTabElements(tabName);
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerHTML = `<div class="message-content">${text}</div>`;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function showSubsidiaryOptions(tabName) {
      const { inputArea } = getTabElements(tabName);
      inputArea.innerHTML = '';
      const container = document.createElement('div');
      container.className = 'input-options';

      subsidiariesList.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = sub;
        btn.addEventListener('click', () => {
          selectSubsidiary(tabName, sub);
        });
        container.appendChild(btn);
      });

      inputArea.appendChild(container);
    }

    function selectSubsidiary(tabName, sub) {
      selectedSubsidiaries = [sub];
      addMessageToTab(tabName, sub, 'user');
      
      setTimeout(() => {
        addMessageToTab(tabName, 'Qual período você deseja analisar?', 'bot');
        showPeriodOptions(tabName);
      }, 500);
    }

    function showPeriodOptions(tabName) {
      const { inputArea } = getTabElements(tabName);
      inputArea.innerHTML = '';
      
      const select = document.createElement('select');
      select.className = 'period-select';
      
      const options = [
        { value: 'quarter_current', text: 'Quarter Atual' },
        { value: 'quarter_last', text: 'Quarter Passado' },
        { value: 'current_week', text: 'Semana Atual' },
        { value: 'last_week', text: 'Semana Passada' },
        { value: 'current_month', text: 'Mês Corrente' },
        { value: 'last_month', text: 'Mês Passado' },
        { value: 'all_time', text: 'Todo Período' }
      ];

      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Selecione um período...';
      placeholder.disabled = true;
      placeholder.selected = true;
      select.appendChild(placeholder);

      options.forEach(opt => {
        const option = document.createElement('option');
        option.value = opt.value;
        option.textContent = opt.text;
        select.appendChild(option);
      });

      select.addEventListener('change', () => {
        if (select.value) {
          const text = options.find(o => o.value === select.value).text;
          selectPeriod(tabName, select.value, text);
        }
      });

      inputArea.appendChild(select);
    }

    function selectPeriod(tabName, value, text) {
      selectedPeriod = value;
      addMessageToTab(tabName, text, 'user');
      tabStates[tabName].conversationState = 'ready';

      setTimeout(() => {
        addMessageToTab(tabName, `Pronto! Subsidiária: ${selectedSubsidiaries[0]} | Período: ${text}`, 'bot');
        showTextInputArea(tabName);
      }, 500);
    }

    function showTextInputArea(tabName) {
      const { inputArea } = getTabElements(tabName);
      inputArea.innerHTML = '';
      
      const row = document.createElement('div');
      row.className = 'text-input-row';

      const input = document.createElement('textarea');
      input.className = 'text-input';
      input.placeholder = 'Faça uma pergunta...';
      input.rows = 1;

      const micBtn = document.createElement('button');
      micBtn.className = 'mic-btn';
      micBtn.textContent = '🎤';
      micBtn.title = 'Usar microfone';

      const sendBtn = document.createElement('button');
      sendBtn.className = 'send-btn';
      sendBtn.textContent = 'Enviar';

      input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      sendBtn.addEventListener('click', sendMessage);

      function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        
        addMessageToTab(tabName, text, 'user');
        input.value = '';
        input.style.height = 'auto';
        
        // TODO: Enviar para Claude para responder sobre o resumo
      }

      micBtn.addEventListener('click', async () => {
        if (!mediaRecorder) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            recordingChunks = [];

            mediaRecorder.ondataavailable = (event) => {
              recordingChunks.push(event.data);
            };

            mediaRecorder.onstop = async () => {
              // TODO: Speech-to-text
              micBtn.classList.remove('recording');
              mediaRecorder = null;
            };

            mediaRecorder.start();
            micBtn.classList.add('recording');
          } catch (error) {
            alert('Erro ao acessar o microfone: ' + error.message);
          }
        } else {
          mediaRecorder.stop();
        }
      });

      row.appendChild(input);
      row.appendChild(micBtn);
      inputArea.appendChild(row);
      inputArea.appendChild(sendBtn);
      
      input.focus();
    }

    function showGoToChatButton(tabName) {
      const { inputArea } = getTabElements(tabName);
      inputArea.innerHTML = '';
      
      const btn = document.createElement('button');
      btn.className = 'action-btn';
      btn.textContent = 'Ir para Chat e Configurar Filtros';
      btn.addEventListener('click', () => {
        document.querySelector('[data-tab="chat"]').click();
      });
      inputArea.appendChild(btn);
    }

    async function generateResumo(tabName) {
      const { messages, inputArea } = getTabElements(tabName);
      
      const type = tabName === 'resumo-exec' ? 'executive' : 'managerial';
      
      addMessageToTab(tabName, 'Gerando resumo...', 'bot');

      try {
        const response = await fetch(`${API_URL}/api/summary`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apiKey,
            context: { 
              subsidiaries: selectedSubsidiaries, 
              period: selectedPeriod,
              type
            }
          })
        });

        const data = await response.json();

        // Remove mensagem de "Gerando..."
        const lastMsg = messages.lastChild;
        if (lastMsg) lastMsg.remove();

        if (data.success) {
          addMessageToTab(tabName, data.summary, 'bot');
          tabStates[tabName].generated = true;
          
          setTimeout(() => {
            showTextInputArea(tabName);
          }, 500);
        } else {
          addMessageToTab(tabName, `Erro: ${data.error}`, 'bot');
        }
      } catch (error) {
        const lastMsg = messages.lastChild;
        if (lastMsg) lastMsg.remove();
        addMessageToTab(tabName, `Erro: ${error.message}`, 'bot');
      }
    }
  </script>
</body>
</html>
